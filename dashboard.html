<!DOCTYPE html>
<html lang="pl" data-layout="landscape">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dashboard domowy</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<!-- biblioteki do przepisow: odczyt .docx i rozpoznawanie tekstu ze zdjecia -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>

  <main id="home" aria-label="Ekran główny">
    <div class="topbar">
      <div id="weather-error" class="weather-error" hidden>Nie udało się pobrać pogody — spróbuję ponownie.</div>
      <button id="sync" class="sync-dot sync-connecting" type="button" aria-label="Łączenie z bazą…" title="Łączenie z bazą…"></button>
      <button id="menu-btn" class="icon-btn icon-btn-glass" type="button" aria-label="Menu" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      </button>
    </div>

    <section class="hero">
      <div class="clock-block">
        <div id="clock" class="clock">--:--</div>
        <div id="date" class="date"></div>
      </div>

      <div class="weather-block">
        <div id="weather-icon" class="weather-icon"></div>
        <div class="weather-main">
          <div class="temp"><span id="temp">--</span><span class="deg">°</span></div>
          <div id="condition" class="condition">Ładowanie pogody…</div>
          <div id="location" class="location"></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="label">Odczuwalna</div><div class="value" id="stat-feels">--°</div></div>
        <div class="stat"><div class="label">Wilgotność</div><div class="value" id="stat-humidity">--%</div></div>
        <div class="stat"><div class="label">Wiatr</div><div class="value" id="stat-wind">--</div></div>
        <div class="stat"><div class="label" id="stat-sun-label">Zachód</div><div class="value" id="stat-sun">--:--</div></div>
      </div>

      <div id="hourly" class="hourly"></div>
      <div id="last-updated" class="last-updated"></div>
    </section>

    <aside id="today" class="today-panel" aria-label="Dziś"></aside>

    <button class="swipe-hint" type="button" aria-label="Otwórz menu" onclick="document.getElementById('menu-btn').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>
    </button>
  </main>

  <div id="menu" class="menu" aria-hidden="true" aria-label="Menu">
    <div class="menu-head">
      <h2>Menu</h2>
      <button id="menu-close" class="icon-btn icon-btn-glass" type="button" aria-label="Zamknij menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
    <div id="menu-grid" class="menu-grid"></div>
  </div>

  <div id="views"></div>

  <noscript><p style="padding:20px">Ta strona wymaga włączonego JavaScriptu.</p></noscript>
</body>
</html>
